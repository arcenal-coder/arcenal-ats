[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arcenal-ats"
version = "0.1.0"
description = "Autonomous recruitment application for YunoHost"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.12,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/arcenal_ats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arcenal_ats"]
