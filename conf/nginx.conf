location = __PATH__ {
    auth_request off;
    return 302 __PATH__/recrutement;
}

location = __PATH__/ {
    auth_request off;
    return 302 __PATH__/recrutement;
}

# Public prefix locations strip the YunoHost installation path before proxying.
location __PATH__/recrutement {
    auth_request off;
    proxy_pass http://127.0.0.1:__PORT__/recrutement;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/public-api/v1 {
    auth_request off;
    proxy_pass http://127.0.0.1:__PORT__/public-api/v1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/public {
    auth_request off;
    proxy_pass http://127.0.0.1:__PORT__/public;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Remote-User $remote_user;
}
