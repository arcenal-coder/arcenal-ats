location = __PATH__ {
    auth_request off;
    return 302 __PATH__/recrutement;
}

location = __PATH__/ {
    auth_request off;
    return 302 __PATH__/recrutement;
}

# The public careers page and its assets are intentionally reachable without
# a YunoHost account. All other routes remain protected by SSOwat.
location ~ ^__PATH__/(recrutement(?:/|$)|public-api/v1(?:/|$)|public(?:/|$)) {
    auth_request off;
    proxy_pass http://127.0.0.1:__PORT__$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Remote-User $remote_user;
}
